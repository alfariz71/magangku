<!doctype html>
<html lang="id" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MagangKu | PT Bimasakti Multi Sinergi</title>

    <!-- Web App Manifest (PWA for Android & Desktop) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#183B66" />

    <!-- Apple iOS / Safari Standalone PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MagangKu" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Dark Mode & Font Size Initializer (Zero Flash) -->
    <script>
      (function() {
        try {
          if (localStorage.getItem('magangku_dark_mode') === 'true') {
            document.documentElement.classList.add('dark');
          }
          var savedSize = localStorage.getItem('magangku_font_size');
          if (savedSize) {
            var fontMap = { small: '14px', normal: '16px', large: '18px' };
            if (fontMap[savedSize]) {
              document.documentElement.style.fontSize = fontMap[savedSize];
            }
          }       
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F7FB] text-[#1E293B] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
